services:
  # Default CPU/CUDA-12 image. WD Tagger extras are optional and off by
  # default (they add ~2 GB of pip-installed CUDA 12 runtime).
  gensight:
    build:
      context: .
      args:
        WITH_ML: "false"
    ports:
      # override with GENSIGHT_PORT=8095 docker compose ...
      - "${GENSIGHT_PORT:-8090}:8090"
    # Write data as the host user instead of root. Without this the
    # container creates root-owned files in the bind-mounted data dir,
    # which a venv-run server (./run.sh) can then no longer write.
    # Override when your account is not 1000:1000:
    #   GENSIGHT_UID=$(id -u) GENSIGHT_GID=$(id -g) docker compose up -d
    user: "${GENSIGHT_UID:-1000}:${GENSIGHT_GID:-1000}"
    volumes:
      - ${GENSIGHT_DATA:-./data}:/opt/gensight/data
      # Mount your image directories read-only, then register the
      # container-side paths (/images/...) in the web UI settings.
      # - /path/to/your/images:/images/set1:ro
    restart: unless-stopped
    # GPU on a CUDA 12 host — requires nvidia-container-toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # CUDA 13 host: the runtime comes from NVIDIA's base image because the
  # nvidia-*-cu13 pip wheels are stubs. Tagger extras are always on here.
  #   docker compose --profile cuda13 build
  #   docker compose --profile cuda13 up -d
  gensight-cuda13:
    profiles: ["cuda13"]
    build:
      context: .
      dockerfile: Dockerfile.cuda13
    ports:
      # override with GENSIGHT_PORT=8095 docker compose ...
      - "${GENSIGHT_PORT:-8090}:8090"
    # Write data as the host user instead of root. Without this the
    # container creates root-owned files in the bind-mounted data dir,
    # which a venv-run server (./run.sh) can then no longer write.
    # Override when your account is not 1000:1000:
    #   GENSIGHT_UID=$(id -u) GENSIGHT_GID=$(id -g) docker compose up -d
    user: "${GENSIGHT_UID:-1000}:${GENSIGHT_GID:-1000}"
    volumes:
      - ${GENSIGHT_DATA:-./data}:/opt/gensight/data
      # - /path/to/your/images:/images/set1:ro
    restart: unless-stopped
    # Requires nvidia-container-toolkit on the host. Without it the
    # container still runs, but the tagger falls back to CPU.
    #
    # If this fails with "could not select device driver" the toolkit is
    # not registered with the daemon yet:
    #   sudo nvidia-ctk runtime configure --runtime=docker
    #   sudo systemctl restart docker
    # On setups where Docker's device autodetection misfires ("AMD CDI
    # spec not found"), swap the block below for CDI:
    #   devices: ["nvidia.com/gpu=all"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
